name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # first color_dots entry is the empty cell; dark uses a visible slate,
          # a near-black cell disappears against GitHub's #0d1117
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#e2e8f0,#a5f3fc,#22d3ee,#0891b2,#155e75
            dist/github-snake-dark.svg?color_snake=#A78BFA&color_dots=#2d3343,#164e63,#0e7490,#06b6d4,#67e8f9

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
